[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--strict-markers" # Removed --strict-paths for testing
testpaths = [
    "tests",
]
pythonpath = [
    "."
]
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.black]
line-length = 100
target-version = ['py38']

[project]
name = "bip"
version = "0.2.0"
description = "Battery Intelligence Platform (BIP) - Embedded Intelligence Framework"
readme = "README.md"
authors = [
    { name = "Hireshkumaran G", email = "hiresh046@gmail.com" }, 
]
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.23.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.2.0",
    "scikit-image>=0.20.0",
    "PyYAML>=6.0",
    "h5py>=3.8.0",
    "tqdm>=4.65.0",
    "seaborn>=0.12.0",
    "statsmodels>=0.14.0",
    "joblib>=1.3.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.4.0",
    "flake8>=6.0.0",
    "shap>=0.42.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
